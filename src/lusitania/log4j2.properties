# Logging settings for Spark (Java side).
# Keeps warnings and errors, but hides the harmless Windows message
# "Exception while deleting Spark temp dir" printed when Spark shuts down.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = off

logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = off

logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error

logger.stringutils.name = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.stringutils.level = error
