name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Java 17 (Spark runs on the JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the project
        run: pip install -e ".[dev,dbt]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest, including the Delta tests)
        run: pytest -v
      - name: dbt parse (every model, test and ref() is valid)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse --target local
